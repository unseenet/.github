name: release-github
# Second half of a release (unseenet#545): the GitHub release for the tag, with
# its CHANGELOG.md section as the notes (the Unreleased section for a test
# release, which is marked as a pre-release), and the "dist" artifact attached
# if there is one. A release another workflow already made is updated.
#
# server: true (with server: true in release-build.yml) also attaches the server
# requirements and SHA256SUMS.txt over every file, for the project key to sign
# (tools/project/sign_release.py --repo <repo> <tag> in unseenet/unseenet, #827).
on:
  workflow_call:
    inputs:
      title:
        description: 'Title before the tag, e.g. "Unseenet graphical" gives "Unseenet graphical v0.3.0"'
        type: string
        required: true
      attach-dist:
        type: boolean
        default: true
      server:
        description: 'Attach the server requirements and SHA256SUMS.txt'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.attach-dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - if: inputs.server
        uses: actions/download-artifact@v4
        with:
          name: server
          path: server/
      - name: Checksums, for the project key to sign
        if: inputs.server
        run: |
          mkdir -p dist
          cp server/* dist/
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            { echo "**Test release $VERSION.**"; echo
              awk '/^## \[Unreleased\]/ {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md; } > notes.md
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.title }}
        run: |
          PRE="--prerelease=false --latest"
          case "$GITHUB_REF_NAME" in *a[0-9]*|*b[0-9]*|*rc[0-9]*) PRE="--prerelease --latest=false";; esac
          FILES=$(ls dist/* 2>/dev/null || true)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            [ -n "$FILES" ] && gh release upload "$GITHUB_REF_NAME" $FILES --clobber
            gh release edit "$GITHUB_REF_NAME" --title "$TITLE $GITHUB_REF_NAME" --notes-file notes.md $PRE --draft=false
          else
            gh release create "$GITHUB_REF_NAME" $FILES --title "$TITLE $GITHUB_REF_NAME" --notes-file notes.md $PRE
          fi
