name: release-build
# First half of a release (unseenet#545): the tag must match __version__ and, for
# a full release, have a section in CHANGELOG.md; then the tests, then the
# package, left as the artifact "dist".
#
# server: true (a service that runs unattended: a gateway, an entrance, a watchman,
# the bots) also writes <name>-<version>-server-requirements.txt - every package
# with its hash - as the artifact "server", which release-github.yml puts in
# SHA256SUMS.txt. Once the project key has signed that, servers running the
# service update to it by themselves (unseenet-service-update --package <name>,
# UN-RFC 0062 section 6.1, unseenet#827). pypi: false for a package that is not on
# PyPI: it is then named by its wheel in this very release.
#
#   on: {push: {tags: ["v*"]}}
#   jobs:
#     build:
#       uses: unseenet/.github/.github/workflows/release-build.yml@main
#       with: {package: unseenet_gui}       # server: true for a service (below)
#     pypi:                      # stays in the calling repo: PyPI's trusted
#       needs: build             # publishing does not accept reusable workflows
#       environment: {name: pypi, url: https://pypi.org/p/unseenet-gui}
#       permissions: {id-token: write}
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/download-artifact@v4
#           with: {name: dist, path: dist/}
#         - uses: pypa/gh-action-pypi-publish@release/v1
#     github:
#       needs: pypi
#       uses: unseenet/.github/.github/workflows/release-github.yml@main
#       with: {title: "Unseenet graphical"}
#       permissions: {contents: write}
on:
  workflow_call:
    inputs:
      package:
        description: 'The import name whose __version__ the tag must match (in src/)'
        type: string
        required: true
      install:
        type: string
        default: '.[dev]'
      setup:
        description: 'Shell commands run after installing, before the tests'
        type: string
        default: ''
      tests:
        type: boolean
        default: true
      server:
        description: 'Also the server requirements (a service that updates itself)'
        type: boolean
        default: false
      pypi:
        description: 'The package is on PyPI (else the requirements name its wheel here)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches the version and the changelog
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'src'); import $PACKAGE; print($PACKAGE.__version__)")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION" >&2; exit 1
          fi
          case "$VERSION" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*) ;;   # test releases: the notes are under [Unreleased]
            *) grep -q "^## \[$VERSION\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; } ;;
          esac
      - run: pip install -e "${{ inputs.install }}" build twine
      - if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - if: inputs.tests
        run: python -m pytest -q
      - run: python -m build && twine check dist/*
      - name: Server requirements, every package with its hash (UN-RFC 0062 5.1, unseenet#827)
        if: inputs.server
        env:
          ON_PYPI: ${{ inputs.pypi }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          pip install uv
          mkdir -p server
          uv pip compile pyproject.toml --universal --generate-hashes \
            --python-version 3.11 --no-header -q -o server/deps.txt
          OUT="server/$NAME-$VERSION-server-requirements.txt"
          { cat server/deps.txt
            if [ "$ON_PYPI" = true ]; then
              printf '%s==%s' "$NAME" "$VERSION"
              for f in dist/*; do printf ' \\\n    --hash=sha256:%s' "$(sha256sum "$f" | cut -d' ' -f1)"; done
            else
              WHEEL=$(cd dist && ls *.whl)
              printf '%s @ https://github.com/%s/releases/download/%s/%s --hash=sha256:%s' \
                "$NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$WHEEL" \
                "$(sha256sum "dist/$WHEEL" | cut -d' ' -f1)"
            fi
            echo; } > "$OUT"
          rm server/deps.txt
          tail -4 "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - if: inputs.server
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: server/
